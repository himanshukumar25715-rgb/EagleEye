version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eagleeye_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./eagle_eye.db
      - SECRET_KEY=eagle-eye-production-secret-key-2026
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eagleeye_web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

